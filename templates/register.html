{% extends "layout.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="shadow p-0 rounded" style="width: 480px;">
        <div class="bg-primary text-white p-2 rounded-top">
            <h3 class="mb-0">Registrasi</h3>
        </div>
        <div class="p-4 bg-white rounded-bottom">
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nama</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Daftar</button>
                </form>
            <div class="card-footer text-center mt-3">
                <small>Sudah punya akun? <a href="{{ url_for('login') }}">Login disini</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
